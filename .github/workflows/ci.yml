name: CI

on: push

env:
  PHP_LOWEST: '8.4'
  PHP_LATEST: '8.5'

jobs:
  tests:
    name: Tests / ${{ matrix.php }} PHP, L ${{ matrix.laravel }}, ${{ matrix.dependencies }} deps

    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [lowest, latest]
        laravel: ['12.*', '13.*']
        dependencies: [lowest, highest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php == 'lowest' && env.PHP_LOWEST || env.PHP_LATEST }}
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: laravel/framework:${{ matrix.laravel }} orchestra/testbench --with-all-dependencies

      - name: Execute tests
        run: vendor/bin/phpunit

  types:
    name: Types / ${{ matrix.php }} PHP, L ${{ matrix.laravel }}, ${{ matrix.dependencies }} deps

    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: lowest
            laravel: '12.*'
            dependencies: lowest
          - php: latest
            laravel: '12.*'
            dependencies: highest
          - php: lowest
            laravel: '13.*'
            dependencies: lowest
          - php: latest
            laravel: '13.*'
            dependencies: highest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php == 'lowest' && env.PHP_LOWEST || env.PHP_LATEST }}
          coverage: none

      - name: PHPStan cache
        uses: actions/cache@v6
        with:
          path: .cache/phpstan
          key: phpstan-${{ github.sha }}
          restore-keys: phpstan-

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: laravel/framework:${{ matrix.laravel }} orchestra/testbench --with-all-dependencies

      - name: Run PHPStan
        run: vendor/bin/phpstan analyze --no-progress --no-interaction

  style:
    name: Style

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_LOWEST }}
          coverage: none

      - name: PHP-CS-Fixer cache
        uses: actions/cache@v6
        with:
          path: .cache/.php-cs-fixer.cache
          key: php-cs-fixer-${{ github.sha }}
          restore-keys: php-cs-fixer-

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction
